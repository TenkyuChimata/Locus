name: Build Locus IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project Locus.xcodeproj \
            -scheme Locus \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Create unsigned IPA
        run: |
          APP="$(find "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos" \
            -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Locus-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: Locus-unsigned
          path: Locus-unsigned.ipa
