name: Build Locus IPA

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  portable-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sh Scripts/test-portable.sh

  native-tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Show native toolchain
        run: |
          xcodebuild -version
          xcrun --sdk macosx clang --version
          xcrun --sdk macosx swiftc --version

      - name: Portable regressions on macOS
        run: sh Scripts/test-portable.sh

      - name: Host regressions (native read-only evidence, Swift assembly and temporary files)
        run: sh Scripts/test-macos.sh

  ios-sdk-checks:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Show device SDK toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphoneos clang --version
      - name: Check native sources against iPhoneOS arm64 SDK
        run: sh Scripts/check-ios-native.sh

  build:
    # Compilation is independent of host tests so both report failures.
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Validate project files
        run: plutil -lint Locus.xcodeproj/project.pbxproj Locus/Locus.entitlements

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project Locus.xcodeproj \
            -scheme Locus \
            -configuration '${{ matrix.configuration }}' \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

  package:
    # Never expose an IPA or upload an unvalidated intermediate app. Rebuild
    # Release for packaging only after both configurations and all tests pass.
    needs: [portable-tests, native-tests, ios-sdk-checks, build]
    if: >-
      ${{ needs.portable-tests.result == 'success' &&
          needs.native-tests.result == 'success' &&
          needs.ios-sdk-checks.result == 'success' &&
          needs.build.result == 'success' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build validated unsigned Release app
        run: |
          xcodebuild \
            -project Locus.xcodeproj \
            -scheme Locus \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Create unsigned IPA
        run: |
          APP="$(find "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos" \
            -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          test -f Payload/Locus.app/LICENSE
          test -f Payload/Locus.app/THIRD_PARTY_NOTICES.md
          test -f Payload/Locus.app/Locus-original-MIT.txt
          zip -qry Locus-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: Locus-unsigned
          path: Locus-unsigned.ipa
